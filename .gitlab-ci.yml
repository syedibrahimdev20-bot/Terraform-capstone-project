image:
  name: hashicorp/terraform:latest
  entrypoint: [""]

stages:
  - init
  - plan
  - apply
  - destroy

init:
  stage: init 
  script:
    - terraform init 

plan:
  stage: plan
  script:
  - terraform init
  - terraform plan

apply:
  stage: apply
  script:
  - terraform init
  - terraform apply -auto-approve
  when: manual

destroy:
  stage: destroy
  script:
   - terraform destroy -auto-approve
  when: manual